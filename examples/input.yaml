# Thal-Kak full-mode input (tutorial).
#   thalkak full --input examples/input.yaml
# Field docs:  thalkak full -h

Method:
  jobname: T1201        # names outputs and the generated FASTA
  msa: colab            # colab | custom | mmseqs_local | hhblits_local | mmseqs_hhblits_local
  structure: [boltz2, chai1, protenix_v1, protenix_v2, esmfold2]   # the only field that may be a list (run in order)
  relax: openmm         # none | openmm
  top5_metric: ranking_score  # top-5 ranking: ranking_score | ptm | iptm | plddt (default ranking_score)
  n_seed: 5             # optional (default 5)
  seed_start: 1         # optional (default 1)
  # a3m_path: examples/T1201.a3m                    # required by msa: custom (ColabFold-format a3m)
  # template_path: examples/template.yaml           # optional, msa: custom only (force user-supplied templates; no search)
  # msa_config: examples/msa_config.combined.yaml   # optional (local msa modes only)
  # model_config: examples/model_config.yaml        # optional (combined, keyed by model)
  # relax_config: examples/openmm.yaml              # optional
  base_dir: outputs/T1201                           # optional, relative to the working directory (default: this file's dir)

Entity:
  # `type` is required. protein/dna/rna use `seq`; ligand uses `smiles` or `ccd`.
  # `copy` = number of chains (builds the stoichiometry).
  # `modifications` (optional) replaces a residue with a modified one, given as a
  # CCD code at a 1-based position. The MSA is still searched with the
  # unmodified sequence.
  - type: protein
    seq: ETGCNKALCASDVSKCLIQELCQCRPGEGNCSCCKECMLCLGALWDECCDCVGMCNPRNYSDTPPTSKSTVEELHEPIPSLFRALTEGDTQLNWNIVSFPVAEELSHHENLVSFLETVNQPHHQNVSVPSNNVHAPYSSDKEHMCTVVYFDDCMSIHQCKISCESMGASKYRWFHNACCECIGPECIDYGSKTVKCMNCMFGTKHHHHHH
    copy: 1
    # modifications:
    #   - position: 113    # 113th residue (S) -> phosphoserine
    #     ccd: SEP

  # Add more entities as needed — examples (commented):
  # - type: dna
  #   seq: GATCGATC
  #   copy: 1
  # - type: ligand
  #   smiles: C1CCCCC1
  #   copy: 1
  # - type: ligand
  #   ccd: ATP
  #   copy: 1

# `Bonds` (optional) covalently attaches a ligand to a residue -- how a glycan is
# modelled, since a sugar has no polymer backbone and so cannot be a
# `modifications` entry. `residue` is 1-based; the chain letters each entity gets
# are logged at startup. Needs a `ccd` ligand (a SMILES one has no atom names).
# Every model but chai-1 uses it; chai-1 logs that it ignored it.
# Bonds:
#   - atom1:
#       chain: A         # chain letters are logged at startup
#       residue: 125     # 1-based
#       atom: ND2        # Asn side-chain N
#     atom2:
#       chain: B
#       residue: 1
#       atom: C1         # NAG anomeric C
